<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>JamKoi setup</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<style>body{background:#eef2f5}.hd{background:#17212b;border-bottom:3px dashed #ffc83d;color:#fff;padding:.8rem 1rem}.btn-y{background:#ffc83d;color:#17212b;font-weight:600;border:0}.btn-y:hover{background:#ffd666}
.step{display:flex;gap:.75rem;align-items:flex-start}.num{flex:none;width:28px;height:28px;border-radius:50%;background:#17212b;color:#fff;display:grid;place-items:center;font-weight:600;font-size:.9rem}.num.ok{background:#1e9e5a}.num.off{background:#9aa7b3}
pre{background:#f6f8fa;border:1px solid #d7dee5;border-radius:.4rem;padding:.6rem;font-size:.8rem;white-space:pre-wrap}</style>
</head>
<body>
<div class="hd"><b>JamKoi</b> &nbsp;setup <span class="text-white-50 small">· জ্যামকই সেটআপ</span></div>
<div class="container my-4" style="max-width:820px">
  <div id="alert"></div>
  <div class="card shadow-sm mb-3"><div class="card-body">
    <div class="step mb-3"><span class="num" id="n1">1</span><div class="flex-grow-1">
      <h2 class="h5 mb-1">Firebase connection <span class="text-muted fs-6">(API + database)</span></h2>
      <div id="s1"></div></div></div>
    <div class="step mb-3"><span class="num off" id="n2">2</span><div class="flex-grow-1">
      <h2 class="h5 mb-1">Database rules &amp; sign-in</h2><div id="s2" class="text-muted small">Waiting for step 1…</div></div></div>
    <div class="step"><span class="num off" id="n3">3</span><div class="flex-grow-1">
      <h2 class="h5 mb-1">Admin account</h2><div id="s3" class="text-muted small">Waiting for step 2…</div></div></div>
  </div></div>
  <div id="done"></div>
  <p class="small text-muted">This page only works until the first admin exists. After that it just links to the app. <a href="index.html?demo=1">Look around in demo mode</a>.</p>
</div>
<script type="module" src="assets/js/setup.js"></script>
</body>
</html>
