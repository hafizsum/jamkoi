<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JamKoi</title>
<meta name="description" content="জ্যামকই - বাংলাদেশের লাইভ ট্রাফিক রিপোর্ট | JamKoi - community traffic reports for Bangladesh">
<meta name="theme-color" content="#17212b">
<meta property="og:title" content="JamKoi - জ্যামকই">
<meta property="og:description" content="Community traffic reports, hotspots and route comparison for Bangladesh.">
<meta property="og:image" content="assets/icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-title="nav.dashboard">
<main id="main" class="jk-page">
  <h1 class="h3 mb-1" data-i18n="nav.dashboard"></h1><p class="text-muted" data-i18n="dash.desc"></p>
  <div class="jk-stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    <div><b data-stat="active_incidents">–</b><span data-i18n="stat.active"></span></div><div><b data-stat="verified_incidents">–</b><span data-i18n="stat.verified"></span></div>
    <div><b data-stat="heavy_incidents">–</b><span data-i18n="stat.heavy"></span></div><div><b data-stat="reports_24h">–</b><span data-i18n="stat.reports24"></span></div>
    <div><b data-stat="votes_24h">–</b><span data-i18n="stat.votes24"></span></div></div>
  <div data-ad-slot="dashboard"></div>
  <div class="jk-grid jk-grid-2">
    <section class="jk-card"><h2 class="h5" data-i18n="dash.hotspots"></h2><p class="small text-muted" data-i18n="dash.hotspots_note"></p><ul class="jk-list" id="dash-hot"><li class="jk-empty" data-i18n="common.loading"></li></ul></section>
    <section class="jk-card"><h2 class="h5" data-i18n="dash.areas"></h2><div class="jk-chart" style="height:340px"><canvas id="chart-areas" role="img"></canvas></div><p class="small text-muted mb-0" data-i18n="dash.areas_note"></p></section>
  </div>
  <section class="jk-card mt-3">
    <div class="d-flex flex-wrap align-items-end gap-3 mb-2"><h2 class="h5 mb-0" data-i18n="dash.history"></h2>
      <div class="ms-auto"><label for="dash-loc" class="form-label small mb-0" data-i18n="report.area"></label><select id="dash-loc" class="form-select form-select-sm"></select></div></div>
    <div class="jk-grid jk-grid-2">
      <div><h3 class="h6" data-i18n="dash.hourly"></h3><div class="jk-chart"><canvas id="chart-hourly" role="img"></canvas></div><p class="small text-muted mb-0" data-i18n="dash.hourly_note"></p></div>
      <div><h3 class="h6" data-i18n="dash.daily"></h3><div class="jk-chart"><canvas id="chart-daily" role="img"></canvas></div></div></div>
  </section>
  <p class="jk-note mt-3" data-i18n="footer.disclaimer"></p></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
