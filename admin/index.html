<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>JamKoi admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-3"><div class="container-fluid"><span class="navbar-brand">JamKoi admin</span>
  <span class="d-flex align-items-center gap-2"><span class="text-light small" id="who"></span><button class="btn btn-sm btn-outline-light d-none" id="logout">Log out</button></span></div></nav>
<div class="container-fluid pb-5">
  <div id="msg"></div>
  <div id="login" class="row justify-content-center mt-4 d-none"><div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
    <h1 class="h4 mb-3">Admin login</h1>
    <form id="login-form"><div class="mb-3"><label class="form-label" for="em">Email</label><input class="form-control" id="em" type="email" required autocomplete="username"></div>
    <div class="mb-3"><label class="form-label" for="pw">Password</label><input class="form-control" id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-dark w-100">Log in</button></form>
    <p class="small text-muted mt-3 mb-0">Create the user in Firebase Console → Authentication, then add a document <code>admins/&lt;uid&gt;</code> in Firestore (see README).</p>
  </div></div></div></div>
  <div id="panel" class="d-none">
    <ul class="nav nav-tabs mb-3" id="tabs"></ul>
    <div id="view"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script type="module" src="../assets/js/admin.js"></script>
</body></html>
